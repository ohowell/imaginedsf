# Pages CMS (https://pagescms.org) editing interface for content/. The build
# checks everything again, so these fields only need to catch mistakes early
# and explain what goes where. Every front matter field has to be listed here,
# since Pages CMS drops fields it doesn't know about when it saves a file.

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    categories: [image]
    rename: safe
  - name: geojson
    label: Pin data
    input: assets/geojson
    output: /assets/geojson
    extensions: [geojson, json]
    rename: safe

components:
  title:
    label: Title
    type: string
    required: true
  year:
    label: Year
    type: number
    options:
      min: 1500
      max: 2100
  # References to other files, chosen by title and saved as file names, like
  # "burnham-plan.md".
  layer:
    type: reference
    options:
      collection: layers
      value: '{name}'
      label: '{title}'
      search: title,name
  layers:
    type: reference
    options:
      collection: layers
      multiple: true
      value: '{name}'
      label: '{title}'
      search: title,name
  groups:
    type: reference
    options:
      collection: groups
      multiple: true
      value: '{name}'
      label: '{title}'
      search: title,name
  zoom:
    type: number
    options:
      min: 0
      max: 24
  # Kept from the old WordPress site so its links still open, and hidden so
  # it isn't changed by accident.
  wordpressId:
    type: number
    hidden: true
  # Saved as Markdown. The editor rewrites a description in its own Markdown
  # once it's edited, and drops HTML and backslash escapes along with what they
  # escape, so descriptions are written without either.
  body:
    label: Text
    type: rich-text
    options:
      format: markdown
      media: images
    description: >-
      Use Heading 2 for sections, and Heading 3 within them, since the title is
      the top heading. Image captions go in the paragraph after the image.

content:
  - name: layers
    label: Layers
    description: >-
      Maps, photo pins and basemaps. A new layer shows on the site once it's
      added to the layers of an era, group or other layer.
    type: collection
    path: content/layers
    format: yaml-frontmatter
    filename: '{primary}.md'
    # File names are part of links, and of other items' lists.
    operations:
      rename: false
    view:
      fields: [year, title]
      sort: [year, title]
      default:
        sort: year
        order: asc
    fields:
      - name: title
        component: title
      - name: year
        component: year
      - name: showWith
        label: Show with
        component: layer
        description: A layer that helps read this one, offered to show underneath it.
      - name: source
        label: Map data
        type: block
        blockKey: type
        required: true
        blocks:
          - name: cog
            label: Scanned map (Cloud Optimized GeoTIFF)
            fields:
              - name: url
                label: GeoTIFF address
                type: string
                required: true
                pattern:
                  regex: '^https://\S+\.tiff?(\?\S*)?$'
                  message: Use an https address ending in .tif or .tiff
          - name: geojson
            label: Pins (GeoJSON)
            fields:
              - name: url
                label: GeoJSON file
                type: file
                required: true
                options:
                  media: geojson
              - name: properties
                label: Pin properties
                description: >-
                  Names of the properties in the GeoJSON that hold each pin's
                  popup text, comma-separated image addresses, and direction
                  in degrees.
                type: object
                fields:
                  - name: text
                    label: Text
                    type: string
                  - name: images
                    label: Images
                    type: string
                  - name: direction
                    label: Direction
                    type: string
          - name: wms
            label: WMS service
            fields:
              - name: url
                label: Service address
                type: string
                required: true
                pattern:
                  regex: '^https://\S+$'
                  message: Use an https address
              - name: layers
                label: Layers
                type: string
                required: true
              - name: minZoom
                label: Minimum zoom
                component: zoom
              - name: maxZoom
                label: Maximum zoom
                component: zoom
          - name: tile
            label: Tiles
            fields:
              - name: url
                label: Tile address
                description: 'Contains {z}, {x} and {y}.'
                type: string
                required: true
                pattern:
                  regex: '^https://\S*\{z\}\S*\{x\}\S*\{y\}'
                  message: Use an https address containing {z}, {x} and {y}
              - name: minZoom
                label: Minimum zoom
                component: zoom
              - name: maxZoom
                label: Maximum zoom
                component: zoom
          - name: style
            label: Map style (basemaps only)
            fields:
              - name: url
                label: Style address
                type: string
                required: true
              - name: darkUrl
                label: Dark mode style address
                type: string
      - name: bbox
        label: Bounding box
        description: >-
          Four numbers: west, south, east, north. The map zooms here when
          someone opens a link to this layer.
        type: number
        list:
          max: 4
          collapsible: false
      - name: layers
        label: Layers under this one
        component: layers
        description: >-
          Like a plan's details and photos. Layers listed under another layer
          can't list layers of their own.
      - name: wordpressId
        component: wordpressId
      - name: body
        component: body

  - name: groups
    label: Groups
    description: >-
      Titled sets of layers. A new group shows on the site once it's added to
      the groups of an era.
    type: collection
    path: content/groups
    format: yaml-frontmatter
    filename: '{primary}.md'
    operations:
      rename: false
    view:
      fields: [year, title]
      default:
        sort: year
        order: asc
    fields:
      - name: title
        component: title
      - name: year
        component: year
      - name: endYear
        label: End year
        description: For groups that span years, like a series of surveys.
        component: year
      - name: layers
        label: Layers
        component: layers
        required: true
      - name: wordpressId
        component: wordpressId
      - name: body
        component: body

  - name: eras
    label: Eras
    type: collection
    path: content/eras
    format: yaml-frontmatter
    filename: '{primary}.md'
    operations:
      rename: false
    view:
      fields: [start, end, title]
      default:
        sort: start
        order: asc
    fields:
      - name: title
        component: title
      - name: start
        label: Start year
        component: year
        required: true
      - name: end
        label: End year
        component: year
        required: true
      - name: groups
        label: Groups
        component: groups
      - name: layers
        label: Layers
        component: layers
      - name: wordpressId
        component: wordpressId
      - name: body
        component: body

  - name: pages
    label: Pages
    description: The introduction, credits and other pages.
    type: collection
    path: content/pages
    format: yaml-frontmatter
    # The site has a fixed set of pages.
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        component: title
      - name: body
        component: body

  - name: site
    label: Basemaps
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - name: basemaps
        label: Basemaps
        description: The layers offered as basemaps, in order.
        component: layers
        required: true
      - name: defaultBasemap
        label: Default basemap
        description: The basemap shown first, which has to be one of the basemaps.
        component: layer
        required: true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imagined San Francisco</title>
    <meta
      name="description"
      content="Historic maps of San Francisco and unrealized plans for the city, layered over a modern map, with an essay on each."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- How links to the site look when shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Imagined San Francisco" />
    <meta property="og:title" content="Imagined San Francisco" />
    <meta
      property="og:description"
      content="Historic maps of San Francisco and unrealized plans for the city, layered over a modern map, with an essay on each."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Imagined San Francisco logo over Daniel Burnham’s 1905 plan for San Francisco"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Lets search results show the site's name rather than its address. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Imagined San Francisco",
        "url": "%SITE_URL%"
      }
    </script>
    <script>
      // Sets the color scheme before the page draws, so it doesn't flash the
      // wrong one: the visitor's choice, or their system's. See src/theme.ts.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('imaginedsf:theme')
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
